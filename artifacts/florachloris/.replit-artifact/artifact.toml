kind = "web"
previewPath = "/"
title = "Flora-Chloris Flowershop POS"
version = "1.0.0"
id = "artifacts/florachloris"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 20858
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/florachloris run dev"

[services.env]
PORT = "20858"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/florachloris", "run", "build"]
publicDir = "artifacts/florachloris/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
